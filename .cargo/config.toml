# Bonsai — local build acceleration (dev-loop speedup, 2026-08-20).
#
# This file only speeds up builds; it changes no compiled behaviour. Delete it
# to fall back to stock cargo. Rationale lives in TODO.md (dev-loop
# acceleration) and the velocity analysis.

# Link with the LLD linker bundled in every Rust toolchain (rust-lld) instead
# of MSVC's link.exe. Linking dominates this workspace's rebuild time — 77+
# integration-test binaries each statically link vendored libgit2 — so a faster
# linker is the single biggest local win, and rust-lld needs no extra install.
# rust-lld ships with the toolchain, so this is safe both locally and on the
# windows-latest CI leg. Delete this block to restore MSVC link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Linux / macOS contributors can opt into LLD too, but it is left OFF by default
# because it needs `lld` installed and the CI runners for those OSes do not have
# it (turning it on globally would break the ubuntu/macos CI legs). To use it
# locally, install lld and uncomment the block for your host target:
#
# [target.x86_64-unknown-linux-gnu]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]
#
# [target.aarch64-apple-darwin]
# rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Shorthand for the accelerated runner (see scripts/gate.mjs and
# .config/nextest.toml). `cargo nt` == `cargo nextest run`.
[alias]
nt = "nextest run"
