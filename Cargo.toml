[workspace]
members = ["src-tauri", "crates/bonsai-core", "crates/bonsai-mcp", "crates/bonsai-forge"]
resolver = "2"

# Enforced MSRV floor, not a convention. `rust-toolchain.toml` pins 1.97 and CI
# honours it, but a build that bypasses the rustup override got no refusal at
# all — and the app now launches `.cmd` files, whose argv escaping mitigation
# (CVE-2024-24576) only exists from Rust 1.77.2. `cargo` refuses to build below
# this; every member inherits it with `rust-version.workspace = true`.
[workspace.package]
rust-version = "1.97"

[workspace.dependencies]
# git2 0.21 dropped `ssh`, `https`, and `cred` from its default features, so we
# opt back into the transports we use. `cred` (git2's own CredentialHelper) is
# intentionally NOT enabled: credential resolution shells out to the real
# `git credential fill` (see git/remote.rs), and `ssh_key_from_agent` +
# `userpass_plaintext` don't need it.
git2 = { version = "0.21", default-features = false, features = ["https", "ssh"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Dev-loop acceleration (2026-08-20). Full debuginfo (`debug = true`, the dev
# default) is the bulk of this workspace's 65 GB debug target and a large share
# of link time across 77+ test binaries. `line-tables-only` keeps file/line
# info in backtraces and panics — everything the test suite and perf gates need
# — while dropping the heavy variable/type debuginfo we never use (no native
# debugger is in the loop). Reverting to `true` restores full debuginfo.
[profile.dev]
debug = "line-tables-only"

# Vendored libgit2 at -O0 makes graph walks (merge-base / descendant-of) ~10x
# slower, which breaks the P29 health perf-ceiling test that must run in the
# ordinary (dev) test suite. Optimize ONLY the C library in dev; Rust crates
# keep full debug info.
[profile.dev.package.libgit2-sys]
opt-level = 2
