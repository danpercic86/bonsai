[package]
name = "bonsai"
version = "0.2.0"
description = "Bonsai — a fast, native Git client"
edition = "2021"

[lib]
name = "bonsai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bonsai-core = { path = "../crates/bonsai-core" }
bonsai-mcp = { path = "../crates/bonsai-mcp" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
git2 = { workspace = true }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rand = "0.9"
subtle = "2"

[dev-dependencies]
tempfile = { workspace = true }
# P16d embedded-HTTP MCP integration test: a raw HTTP client to drive the
# streamable-HTTP MCP endpoint (security POSTs + hand-rolled JSON-RPC/SSE).
# `no_proxy` client is built in-test; default TLS is unused (plain 127.0.0.1).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
