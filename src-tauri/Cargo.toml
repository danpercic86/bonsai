[package]
name = "bonsai"
version = "0.1.0"
description = "Bonsai — a fast, native Git client"
edition = "2021"

[lib]
name = "bonsai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
git2 = "0.20"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "graph_layout"
harness = false
