[package]
name = "bonsai"
version = "1.0.0"
description = "Bonsai — a fast, native Git client"
edition = "2021"
license = "MIT"
repository = "https://github.com/danpercic86/bonsai"

[lib]
name = "bonsai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bonsai-core = { path = "../crates/bonsai-core" }
bonsai-mcp = { path = "../crates/bonsai-mcp" }
bonsai-forge = { path = "../crates/bonsai-forge" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
git2 = { workspace = true }
notify = "8"
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "3.0.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
rand = "0.9"
subtle = "2"

# The macOS universal build cross-compiles an x86_64 slice from the arm64 CI
# runner. git2's https/ssh stack (libgit2-sys + libssh2-sys) links native
# OpenSSL, which pkg-config cannot locate for the cross-arch target. Build
# OpenSSL from source (vendored) so each arch links its own copy. Scoped to
# macOS so the Windows (SChannel/WinCNG, no OpenSSL) and Linux (system
# libssl-dev) legs are untouched. Feature-unifies with the base git2 dep, so
# the whole app graph's single openssl-sys builds vendored on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { workspace = true, features = ["vendored-openssl"] }

[dev-dependencies]
tempfile = { workspace = true }
# P16d embedded-HTTP MCP integration test: a raw HTTP client to drive the
# streamable-HTTP MCP endpoint (security POSTs + hand-rolled JSON-RPC/SSE).
# `no_proxy` client is built in-test; default TLS is unused (plain 127.0.0.1).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
