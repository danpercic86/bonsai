[package]
name = "bonsai-deps"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[lib]
name = "bonsai_deps"

# P125 dependency tracker (docs/contracts/P125-dependency-tracker.md). This
# crate NEVER spawns a process (clippy.toml ban + tests/no_process.rs) and uses
# only the §7.4 allowlist of bonsai-core items. Dependencies are added in the
# sub-increment that first uses them, so every change to the set shows up in
# the committed `dep-tree.txt` snapshot (§7.4, MEDIUM-4).
[dependencies]
serde = { workspace = true }
semver = "1"
# P125b: discovery (index + statuses) is in-process git2.
git2 = { workspace = true }
# P125b: package.json / package-lock.json.
serde_json = { workspace = true }
# P125b `[MEDIUM-1]`: host extraction for registry URLs.
url = "2"
# P125b `[HIGH-2]`: used ONLY through the `parser::Parser` event API
# (`yaml_events.rs`); `YamlLoader` is banned. No `encoding` feature.
yaml-rust2 = { version = "0.13", default-features = false }
# P125c1: Cargo.toml / Cargo.lock / `.cargo/config{,.toml}`. Parse + serde
# only: no `display` (writer) and never `unbounded` (it lifts toml_parser's
# own depth bound). Every parse is preceded by `toml_scan::check_depth`
# `[HIGH-2]`; a `toml::de::Error` is mapped by span only, never `Display`ed.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# P125c2: NuGet.Config / MSBuild project files / packages.config. Used ONLY
# through the pull `Reader` event API (`xml_events.rs`); no `serialize`
# (serde) and no `encoding` feature. A DOCTYPE is rejected outright and
# entities are resolved in-house (the five predefined + char refs only).
quick-xml = { version = "0.41", default-features = false }

# `FakeHostEnv` for the integration sentinels; never on in production.
[features]
test-support = []

[dev-dependencies]
# Self, with the test double enabled for `tests/`.
bonsai-deps = { path = ".", features = ["test-support"] }
proptest = "1.6"
tempfile = { workspace = true }
