# Bonsai — release + auto-update publisher.
#
# Trigger: push a semver tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`),
# or run manually from the Actions tab.
#
# FLOW (three stages so releases can be IMMUTABLE):
#   1. create-release  — creates a DRAFT GitHub Release for the tag.
#   2. build-tauri     — per OS: builds, signs the updater artifacts, and uploads
#                        installers + `.sig` + `latest.json` INTO THE DRAFT.
#   3. publish-release — flips the draft to published, AFTER every asset is
#                        attached. This is the moment the release becomes
#                        immutable (nothing is ever added post-publish).
#
# Why the split: GitHub immutable releases freeze the release and its assets at
# PUBLISH time. The old flow auto-published on the first matrix job and pushed
# assets in afterwards — which immutability forbids, and which left no draft to
# publish by hand. Now everything lands in a draft first; publishing is the last,
# gated step.
#
# MANUAL GATE: the `publish-release` job targets the `release-publish`
# environment. Add a required-reviewer protection rule to that environment
# (Settings → Environments → release-publish → Required reviewers) and the run
# will PAUSE before publishing until you approve it in the Actions UI. Remove the
# `environment:` line to publish automatically once all builds succeed. Either
# way, the fully-populated draft is also visible under Releases if you prefer to
# click Publish there instead.
#
# WINDOWS ARTIFACT: NSIS `-setup.exe` ONLY — there is deliberately no `.msi`
# (`bundle.targets` in tauri.conf.json omits it). The WiX/MSI relaunch runs the
# app as a child of `msiexec.exe`, so it inherits the installer's environment
# instead of the user's; NSIS relaunches with a profile-derived environment.
# `updaterJsonPreferNsis: true` below pins `latest.json` to the NSIS artifact so
# the defect cannot come back if `msi` is ever re-added.
# See docs/contracts/P71-updater-relaunch-env.md (§1.2–§1.3, D3).
#
# The updater endpoint in `src-tauri/tauri.conf.json`
#   (`plugins.updater.endpoints`) must point at:
#   https://github.com/danpercic86/bonsai/releases/latest/download/latest.json
# so installed clients read the manifest this workflow publishes. `/latest`
# resolves only to PUBLISHED releases, so the updater sees a version only after
# stage 3 runs — exactly what we want.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           # contents of your PROD .tauri/updater-prod.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  # the password you set when generating it
# Its PUBLIC half must be in tauri.conf.json → plugins.updater.pubkey, or every
# client rejects the update as a bad signature.
#
# OPTIONAL (OS code-signing — uncomment the env blocks below once you have them):
#   Windows Authenticode via `bundle.windows.certificateThumbprint` in the config;
#   macOS Developer ID + notarization via APPLE_* secrets.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Allow the jobs to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: create the draft release the matrix uploads into.
  # ---------------------------------------------------------------------------
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref_type === 'tag'
              ? context.ref.replace('refs/tags/', '')
              : `app-v${{ steps.version.outputs.version }}`;
            const name = `Bonsai v${{ steps.version.outputs.version }}`;

            // Reuse an existing draft for this tag if a previous run left one,
            // otherwise create a fresh draft.
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            let release = releases.data.find(r => r.tag_name === tag && r.draft);
            if (!release) {
              const created = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name,
                body: 'See the assets below to download and install this version.',
                draft: true,
                prerelease: false,
              });
              release = created.data;
            }
            core.setOutput('release_id', release.id);

  # ---------------------------------------------------------------------------
  # Stage 2: build every OS and upload its artifacts into the draft.
  # ---------------------------------------------------------------------------
  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal macOS build (Apple Silicon + Intel in a single .dmg).
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          # ubuntu-22.04 for a broad glibc / webkit2gtk-4.1 baseline.
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
          - platform: windows-latest
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Linux native deps for Tauri v2 (webkit2gtk 4.1 + NSIS-free bundlers).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json "packageManager" (pnpm@11.17.0).

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          # pnpm 11.17.0 (from package.json packageManager) requires Node >= 22.13.
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Channel (1.97) comes from rust-toolchain.toml, so the extra macOS
          # targets below attach to the SAME toolchain the build actually uses
          # (the old dtolnay@stable step added them to `stable`, which the
          # rust-toolchain.toml override then bypassed -> universal build failed).
          target: ${{ matrix.rust-targets }}
          # A dedicated swatinem/rust-cache step (below) handles caching, scoped
          # to ./src-tauri -> target, so disable this action's built-in cache to
          # avoid double-caching.
          cache: false

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign, and upload into the draft
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (REQUIRED for auto-update to verify).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code-signing + notarization (optional; uncomment when ready) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Upload into the draft created in stage 1 instead of creating/publishing
          # a release here. This is what keeps the release a draft until stage 3.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # tauri-action generates + attaches latest.json when updater artifacts
          # are produced (createUpdaterArtifacts: true is already set in the config).
          includeUpdaterJson: true
          # P71: never point latest.json at a .msi. tauri-action's default is
          # `false` "for legacy reasons", which is how v1.0.0's manifest ended up
          # referencing the MSI (docs/contracts/P71-updater-relaunch-env.md §1.1).
          # `bundle.targets` already omits msi; this is belt-and-braces so the
          # manifest stays correct even if msi is ever re-added.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # Stage 3: publish the fully-populated draft (this makes it immutable).
  # Gated on the `release-publish` environment — add a required-reviewer rule to
  # that environment for a manual "release it myself" approval step.
  # ---------------------------------------------------------------------------
  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    environment: release-publish
    steps:
      # Refuse to publish a half-built release: once published it is immutable,
      # so a missing OS installer or updater artifact can't be fixed afterwards.
      # Each entry is [human label, regex the asset name must match]. Keep this in
      # sync with bundle.targets in src-tauri/tauri.conf.json.
      - name: Guard — draft must be complete
        uses: actions/github-script@v7
        with:
          script: |
            const assets = await github.paginate(
              github.rest.repos.listReleaseAssets,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: ${{ needs.create-release.outputs.release_id }},
                per_page: 100,
              },
            );
            const names = assets.map(a => a.name);

            const required = [
              ['Windows NSIS installer',        /-setup\.exe$/],
              ['Windows updater signature',     /-setup\.exe\.sig$/],
              ['macOS disk image',              /\.dmg$/],
              ['macOS updater bundle',          /\.app\.tar\.gz$/],
              ['macOS updater signature',       /\.app\.tar\.gz\.sig$/],
              ['Linux AppImage',                /\.AppImage$/],
              ['Linux updater signature',       /\.AppImage\.sig$/],
              ['Linux .deb package',            /\.deb$/],
              ['Linux .rpm package',            /\.rpm$/],
              ['Updater manifest (latest.json)', /^latest\.json$/],
            ];

            const missing = required
              .filter(([, re]) => !names.some(n => re.test(n)))
              .map(([label]) => label);

            core.info(`Draft has ${names.length} asset(s):\n  ${names.join('\n  ')}`);
            if (missing.length) {
              core.setFailed(
                `Refusing to publish — draft is missing:\n  - ${missing.join('\n  - ')}`,
              );
            }

      - name: Publish the release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
              make_latest: 'true',
            });
