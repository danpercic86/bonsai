# Bonsai — CI gate (audit 2026-08-07 §4.4).
#
# Runs the full AI gate on every push/PR to main: Rust tests, clippy
# (warnings = errors), frontend lint + unit tests, the tsc + vite build,
# the file-size ratchet, and supply-chain scanning.
# Rust steps run SEQUENTIALLY within each job — cargo test and clippy sharing
# a target dir concurrently causes spurious failures (known race).
#
# The `rust` job runs on all three target OSes (Linux/Windows/macOS): Bonsai
# shells out to `git`, touches paths, and spawns CLI helpers, so path
# separators, line endings and process spawning are genuinely OS-dependent.
# `frontend` also runs on macOS: the TypeScript jobs used to be Linux-only, and
# that blind spot is what let a batch of macOS-only UI defects through. `e2e` and
# `audit` stay on Linux only — Playwright drives the mock harness in a bundled
# chromium, and dependency graphs are OS-independent for our targets.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — cargo test + clippy (${{ matrix.platform }})
    strategy:
      # One OS failing must not hide the result on the other two.
      fail-fast: false
      matrix:
        # Same OS set as release.yml; ubuntu-22.04 for the glibc/webkit baseline.
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same native deps as release.yml — src-tauri (tauri v2 + webkit2gtk)
      # must compile for --workspace test/clippy runs. Linux only: macOS uses
      # system WebKit and Windows uses WebView2, both preinstalled.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          # swatinem/rust-cache below handles caching (matches release.yml).
          cache: false

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # The key MUST include the OS: the three runners produce
          # incompatible target dirs and would poison each other's cache.
          key: ci-${{ matrix.platform }}

      # git identity for the fixture/scratch repos the test suites create.
      # Required on every platform — the suites commit.
      - name: Configure git identity for tests
        shell: bash
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@bonsai.test"

      # BONSAI_REQUIRE_GIT_STRICT=1: a missing `git` CLI turns every would-be
      # runtime skip into a loud failure — CI can never silently skip
      # git-dependent tests (T1 contract §4).
      #
      # `shell: bash` + a workspace-relative log path so the same script runs on
      # the Windows runner (default shell there is PowerShell, which has no
      # `pipefail`/`tee -a` semantics; /tmp does not exist either).
      - name: cargo test
        shell: bash
        env:
          BONSAI_REQUIRE_GIT_STRICT: '1'
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log

      # Known baseline: 3 #[ignore]d perf gates (large-fixture benchmarks) —
      # visible in the summary, not failed on. No other ignores.
      - name: Surface ignored/skipped test counts
        if: always()
        shell: bash
        run: |
          echo "## cargo test summary — ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^test result:' cargo-test.log >> "$GITHUB_STEP_SUMMARY" || true
          grep -c 'skipping:' cargo-test.log | xargs -I{} echo 'runtime skips: {}' >> "$GITHUB_STEP_SUMMARY" || true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend — vitest + build (${{ matrix.platform }})
    strategy:
      # A macOS leg exists deliberately: this job and `e2e` were ubuntu-only,
      # which is exactly how a batch of macOS-only UI defects (Cmd+Enter, font
      # fallback, shortcut labels) reached a release branch unnoticed. Windows
      # is already covered for the parts that are OS-sensitive by the `rust` job.
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json "packageManager".

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # ESLint (flat config, src/ + e2e/). Errors fail the build; warnings are a
      # tracked cleanup backlog capped by --max-warnings (see eslint.config.js).
      - name: pnpm lint (eslint)
        run: pnpm lint:ci

      # File-size ratchet: no new file over 500 lines, no baselined file grows.
      - name: pnpm lint:size (file-size ratchet)
        run: pnpm lint:size

      # Runs BOTH vitest projects (node + dom) and writes coverage/.
      - name: pnpm test:coverage
        run: pnpm test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary-${{ matrix.platform }}
          path: coverage/coverage-summary.json

      - name: pnpm build (tsc + vite)
        run: pnpm build

  e2e:
    name: E2E — Playwright vs mock harness
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # CI env is set by Actions → chromium project + webServer autostart.
      - name: pnpm test:e2e
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      # Trace zips (trace: 'on-first-retry' in playwright.config.ts) — the only
      # way to diagnose a failure that doesn't reproduce locally.
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Supply-chain scanning: Rust advisories/licenses/bans via cargo-deny, npm
  # advisories via `pnpm audit`. Both are configured to be GREEN today (see
  # deny.toml and pnpm-workspace.yaml -> auditConfig.ignoreGhsas) so a new
  # finding is what turns the job red. Linux only — dependency graphs are
  # OS-independent for our targets.
  # ---------------------------------------------------------------------------
  audit:
    name: Audit — cargo-deny + pnpm audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No compilation happens here (cargo-deny reads Cargo.lock), so no
          # rust-cache step and no clippy component.
          cache: false

      # Prebuilt binary — building cargo-deny from source costs several minutes.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # advisories + bans + licenses + sources, all four configured in deny.toml.
      - name: cargo deny check
        run: cargo deny --all-features check

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Ignored advisories are listed (with a reason) in pnpm-workspace.yaml.
      - name: pnpm audit
        run: pnpm audit --audit-level high
