# Bonsai — CI gate (audit 2026-08-07 §4.4).
#
# Runs the full AI gate on every push/PR to main: Rust tests, clippy
# (warnings = errors), frontend unit tests, and the tsc + vite build.
# Rust steps run SEQUENTIALLY in one job — cargo test and clippy sharing
# a target dir concurrently causes spurious failures (known race).
#
# Ubuntu only: the suite is platform-independent logic (Windows/macOS
# specifics are covered by unit tests with mocked runners); the 3-OS
# matrix stays in release.yml where the native bundles are built.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — cargo test + clippy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same native deps as release.yml — src-tauri (tauri v2 + webkit2gtk)
      # must compile for --workspace test/clippy runs.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
          # swatinem/rust-cache below handles caching (matches release.yml).
          cache: false

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ci-${{ runner.os }}

      # git identity for the fixture/scratch repos the test suites create.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@bonsai.test"

      # BONSAI_REQUIRE_GIT_STRICT=1: a missing `git` CLI turns every would-be
      # runtime skip into a loud failure — CI can never silently skip
      # git-dependent tests (T1 contract §4).
      - name: cargo test
        env:
          BONSAI_REQUIRE_GIT_STRICT: '1'
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee /tmp/cargo-test.log

      # Known baseline: 3 #[ignore]d perf gates + 1 #[ignore]d rebase known-bug
      # — visible in the summary, not failed on.
      - name: Surface ignored/skipped test counts
        run: |
          echo '## cargo test summary' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^test result:' /tmp/cargo-test.log >> "$GITHUB_STEP_SUMMARY"
          grep -c 'skipping:' /tmp/cargo-test.log | xargs -I{} echo 'runtime skips: {}' >> "$GITHUB_STEP_SUMMARY" || true

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend — vitest + build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version is read from package.json "packageManager".

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Runs BOTH vitest projects (node + dom) and writes coverage/.
      - name: pnpm test:coverage
        run: pnpm test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json

      - name: pnpm build (tsc + vite)
        run: pnpm build

  e2e:
    name: E2E — Playwright vs mock harness
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # CI env is set by Actions → chromium project + webServer autostart.
      - name: pnpm test:e2e
        run: pnpm test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
